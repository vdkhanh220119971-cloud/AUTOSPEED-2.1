name: Build Speedhack Dylib
        
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
 
jobs: 
  build:
    runs-on: macos-latest

    steps:
      - name: Set up job
        run: echo "Starting build process..."

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile Dylib with Clang
        run: |
          clang -dynamiclib \
            -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
            -arch arm64 -arch arm64e \
            -miphoneos-version-min=14.0 \
            -fobjc-arc \
            -O3 \
            Speedhack.m SpeedhackMenu.m fishhook.c \
            -framework Foundation -framework CoreFoundation -framework UIKit -framework CoreGraphics \
            -o Speedhack.dylib

      - name: Ad-hoc Code Sign Dylib
        run: |
          codesign -s - Speedhack.dylib

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Speedhack-dylib
          path: Speedhack.dylib
